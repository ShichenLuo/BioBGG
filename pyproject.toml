[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biobgg"
version = "0.1.0"
description = "Brain functional connectivity classification with BioBGG and baseline models"
readme = "readme.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torch-geometric==2.5.3",
    "numpy>=1.23,<2",
    "pandas==2.0.3",
    "scipy>=1.9,<1.12",
    "scikit-learn==1.3.2",
    "matplotlib==3.7.3",
    "seaborn==0.13.0",
    "nilearn==0.10.2",
    "einops>=0.4.1,<1",
    "omegaconf>=2.2,<3",
    "tqdm>=4.63,<5",
]

[project.optional-dependencies]
# Additional dependencies for the bundled STAGIN analysis and helper scripts.
stagin = [
    "joblib>=1.1,<2",
    "nipy>=0.5,<1",
    "pingouin>=0.5.3,<0.6",
    "opencv-python>=4.5,<4.12",
    "python-telegram-bot==20.3",
]
baselines = ["PyYAML>=6,<7"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_loader*", "models*", "modelsLR*", "Train_Test_Eval*", "util*"]
namespaces = true
